<!DOCTYPE html>
<html lang="es">
    <head>
        <title>JavaScript</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <script>
            let i = 0;
            let intervalo = setInterval(() =>{
                console.log(i);
                i++;
                if(i > 10) clearInterval(intervalo);
            }, 1000);
        </script>
    </body>
</html>
