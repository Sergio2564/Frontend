<!DOCTYPE html>
<html lang="es">
    <head> 
        <title>Registro Clientes</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/bootstrap.min.css" />
    </head>
    <body>
        <h1>Formulario de Registro de Productos</h1>

        <div class="mb-3">
            <label for="codigo_barras" class="form-label">Código de barras</label>
            <input type="text" class="form-control" id="codigo_barras">
        </div>

        <div class="mb-3">
            <label for="categoria">Categoria</label>
            <select id="categoria" class="form-select">
                <option selected disabled>Seleccione una</option>
                <option>Hogar</option>
                <option>Climatización</option>
                <option>Tecnología</option>
            </select>
        </div>

        <div class="mb-3 form-floating">
            <textarea class="form-control" id="descripcion"></textarea>
            <label for="descripcion">Descripción</label>
        </div>

        <div class="mb-3 form-check">
            <input type="radio" name="iva" id="radio1">
            <label for="radio1">Excento</label>
        </div>

        <div class="mb-3 form-floating">
            <textarea class="form-control" id="descripcion"></textarea>
            <label for="descripcion">Descripción</label>
        </div>

        <div class="mb-3 form-check">
            <input type="radio" name="iva" id="radio1">
            <label for="radio1">Excento</label>
            
            <input type="radio" name="iva" id="radio2">
            <label for="radio2">IVA 5%</label>
            
            <input type="radio" name="iva" id="radio3">
            <label for="radio3">IVA 10%</label> 
        </div>

        <div class="mb-3">
            <label for="foto_producto"></label>
            <input type="file" id="foto_producto">
        </div>

        <button id="btn_save" class="btn btn-success">Guardar</button>
        <button id="btn_reset" class="btn btn-secondary">Resetear</button>
    </body>
</html>
