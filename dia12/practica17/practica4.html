<!DOCTYPE html>
<html lang="es-PY">
    <head>
        <title>Primer ejercicio de JavaScript</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <script>
            let numero = parseInt(prompt("Escribe un número: "));
            if(numero % 2 == 0){
                document.write(numero + " es par ");
            }else{
                document.write(numero + " es impar ");
            }
        </script>
    </body>
</html>
