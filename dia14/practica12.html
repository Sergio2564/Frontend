<!DOCTYPE html>
<html lang="es">
    <head>
        <title>JavaScript</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <script>
            let suma = 0;
            while(suma < 100){
                let num = parseInt(prompt("Introduce un número: "));
                suma += num;
            }
            console.log("Suma total: ", suma);
        </script>
    </body>
</html>
