<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 1 - Tablas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Horario de Clases</h1>
    <table id="horario">
        <thead>
            <tr>
                <th>Dia</th>
                <th>Materia</th>
                <th>Hora</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>Lunes</td><td>Programacion</td><td>08:00</td></tr>
            <tr><td>Martes</td><td>Base de Datos</td><td>10:00</td></tr>
            <tr><td>Miercoles</td><td>Redes</td><td>14:00</td></tr>
        </tbody>
    </table>
    <script src="script.js"></script>
</body>
</html>
