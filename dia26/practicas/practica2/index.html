<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2 - Acciones de Botones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
        <h1>Contador Interactivo</h1>
        <p>Usa los botones para aumentar, disminuir o reiniciar el valor.</p>
        <p id="valor">0</p>

        <div class="botones">
            <button id="btnMenos">-</button>
            <button id="btnReset">Reiniciar</button>
            <button id="btnMas">+</button>
        </div>

        <script src="script.js"></script>
</body>
</html>
