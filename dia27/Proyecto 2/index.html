<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoStore | Tu Tienda de Tecnología</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Lucide Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- NAVBAR -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
        <div class="container mx-auto px-4 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2 text-xl font-extrabold text-emerald-600 tracking-tight">
                <i data-lucide="cpu" class="w-6 h-6"></i>
                <span>TecnoStore</span>
            </a>

            <!-- Botón de Carrito -->
            <button id="cart-toggle-btn"
                class="relative p-2.5 bg-slate-100 hover:bg-slate-200 rounded-full transition-all duration-200 group">
                <i data-lucide="shopping-cart" class="w-5 h-5 text-slate-700 group-hover:text-emerald-600"></i>
                <span id="cart-badge"
                    class="absolute -top-1 -right-1 bg-emerald-500 text-white text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center scale-0 transition-transform duration-200">0</span>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <!-- SECCIÓN: DETALLE DE PRODUCTO (Oculta por defecto) -->
        <section id="product-detail-section"
            class="hidden mb-12 bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-sm transition-all">
            <button id="back-to-catalog-btn"
                class="flex items-center gap-2 text-slate-500 hover:text-emerald-600 font-medium mb-6 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver al catálogo
            </button>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center" id="detail-content">
                <!-- Contenido dinámico desde JS -->
            </div>
        </section>

        <!-- SECCIÓN: CATÁLOGO -->
        <section id="catalog-section">
            <div class="mb-8">
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Equipos y Accesorios Premium</h1>
                <p class="text-slate-500 mt-1">Explorá nuestra selección exclusiva de tecnología con garantía local.</p>
            </div>

            <!-- Grilla Responsiva de Productos -->
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Tarjetas dinámicas desde JS -->
            </div>
        </section>
    </main>

    <!-- SIDE-OVER: CARRITO DE COMPRAS -->
    <div id="cart-sidebar" class="fixed inset-0 z-50 overflow-hidden hidden" aria-labelledby="slide-over-title"
        role="dialog" aria-modal="true">
        <div class="absolute inset-0 overflow-hidden">
            <!-- Fondo oscuro translúcido -->
            <div id="cart-overlay"
                class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity duration-300 opacity-0">
            </div>

            <div class="pointer-events-none fixed inset-y-0 right-0 flex max-w-full pl-10">
                <div id="cart-panel"
                    class="pointer-events-auto w-screen max-w-md transform transition-transform duration-300 translate-x-full">
                    <div class="flex h-full flex-col bg-white shadow-2xl border-l border-slate-200">
                        <!-- Header del Carrito -->
                        <div class="flex items-start justify-between px-6 py-5 border-b border-slate-100">
                            <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                                <i data-lucide="shopping-bag" class="text-emerald-600"></i> Tu Carrito
                            </h2>
                            <button id="cart-close-btn"
                                class="p-1 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-600 transition-colors">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>

                        <!-- Lista de Productos en Carrito -->
                        <div class="flex-1 overflow-y-auto px-6 py-4 space-y-4" id="cart-items-container">
                            <!-- Elementos del carrito dinámicos -->
                        </div>

                        <!-- Resumen de Compra -->
                        <div class="border-t border-slate-100 px-6 py-6 bg-slate-50">
                            <div class="space-y-1.5 mb-6">
                                <div class="flex justify-between text-sm text-slate-500">
                                    <span>Subtotal</span>
                                    <span id="summary-subtotal">₲ 0</span>
                                </div>
                                <div class="flex justify-between text-sm text-slate-500">
                                    <span>Envío</span>
                                    <span class="text-emerald-600 font-medium">Gratis</span>
                                </div>
                                <div
                                    class="flex justify-between text-base font-bold text-slate-900 pt-2 border-t border-dashed border-slate-200">
                                    <span>Total estimado</span>
                                    <span id="summary-total" class="text-emerald-600">₲ 0</span>
                                </div>
                            </div>

                            <div class="space-y-3">
                                <button id="checkout-btn"
                                    class="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white py-3 px-4 rounded-xl font-bold transition-all shadow-sm shadow-emerald-200 active:scale-[0.98]">
                                    Proceder al Pago
                                </button>
                                <button id="clear-cart-btn"
                                    class="w-full text-center text-xs text-slate-400 hover:text-rose-500 font-medium transition-colors">
                                    Vaciar todo el carrito
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800">
        <div class="container mx-auto px-4 text-center">
            <p class="font-semibold text-slate-200 mb-1">TecnoStore Paraguay &copy; 2026</p>
            <p class="text-xs">Precios expresados en Guaraníes, IVA Incluido. Entrega rápida a todo el país.</p>
        </div>
    </footer>

    <!-- Archivo JavaScript Modular -->
    <script src="app.js"></script>
</body>

</html>
