<!DOCTYPE html>
<html lang="es-PY">
    <head>
        <title>JavaScript</title>
        <meta charset="UTF-8">
    </head>
    <body>
        <script>
            let numero = parseInt(prompt("Introduce un número: "));
            for(let i=1; i<=10; i++){
                console.log(`${numero} x ${i} = ${numero * i}`);
            }
        </script>
    </body>
</html>
